name: Windows package
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.21.0
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - run: pnpm install --frozen-lockfile
      - run: .\.venv\Scripts\python.exe scripts/fetch_runtime.py
      - run: .\.venv\Scripts\python.exe -m pytest -q
      - run: pnpm typecheck
      - run: node --experimental-strip-types --test tests/taskLibrary.test.mjs
      - run: .\build_windows.ps1
      - name: Verify bundled example and model-free exports
        run: |
          $env:VIDEOSUMMARIZER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'shuying-core-test'
          $appTest = Start-Process -FilePath 'dist/VideoSummarizer/VideoSummarizer.exe' -ArgumentList '--self-test-core' -WindowStyle Hidden -PassThru -Wait
          if ($appTest.ExitCode -ne 0) { throw 'Packaged core self-test failed' }
      - run: Compress-Archive -Path dist/VideoSummarizer -DestinationPath dist/Shuying-windows-x64.zip
      - run: Get-FileHash dist/Shuying-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shuying-windows-x64-test-build
          path: |
            dist/Shuying-windows-x64.zip
            dist/SHA256.txt
      - name: Attach package to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG dist/Shuying-windows-x64.zip dist/SHA256.txt
